# playwebac.com sites (bootstrap.sh fills @WEB_HOSTS@ / @BRIDGE_HOSTS@ from /webac/host/env).
# The upstream files name the live container's port; deploy-agent.sh rewrites
# them and reloads nginx when it switches to a new build.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream webac_web {
    include /etc/nginx/webac/web-upstream.conf;
    keepalive 16;
}

upstream webac_bridge {
    include /etc/nginx/webac/bridge-upstream.conf;
}

ssl_certificate     /etc/webac/tls/webac.crt;
ssl_certificate_key /etc/webac/tls/webac.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:webac:10m;
ssl_session_timeout 1d;

server {
    listen 80 default_server;
    server_name _;
    location / {
        return 301 https://$host$request_uri;
    }
}

# Unknown names on 443 (scanners hitting the bare IP): close without an answer.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# Static client: the web container (Caddy) sets its own cache and security headers.
server {
    listen 443 ssl;
    http2 on;
    server_name @WEB_HOSTS@;
    location / {
        proxy_pass http://webac_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Bridge: WebSockets plus its small HTTP API. The bridge reads the player's
# address from X-Real-IP (BRIDGE_CLIENT_IP_HEADER=x-real-ip, BRIDGE_TRUST_PROXY=1);
# nginx overwrites whatever the client sent.
server {
    listen 443 ssl;
    http2 on;
    server_name @BRIDGE_HOSTS@;
    client_max_body_size 1m;
    location / {
        proxy_pass http://webac_bridge;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
}
