# /etc/nginx/nginx.conf on the webac host (installed by bootstrap.sh).
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;
# A reload (a deploy switch, a cert renewal, a host-config change) keeps the old workers
# serving their open WebSockets: game sessions run for hours, and a reload unrelated to a
# player's bridge must never cut them. Keep this long even though the bridge's drain is now
# a 15 min backstop (BRIDGE_DRAIN_SECONDS=900, 2026-10-17): drained players are handed over
# within seconds (docs/bridge-handover.md), so an old worker's live sessions are the
# undrained ones.
worker_shutdown_timeout 6h10m;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # $pid / $connection / $msec / $upstream_addr: which worker held a WebSocket, when it ended to the ms,
    # and which bridge port served it, so a drop near a reload is answerable from one line (2026-10-17).
    log_format main '$remote_addr - [$time_iso8601] "$host" "$request" $status $body_bytes_sent $request_time pid=$pid conn=$connection end=$msec up=$upstream_addr';
    access_log /var/log/nginx/access.log main buffer=32k flush=10s;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    include /etc/nginx/conf.d/*.conf;
}
