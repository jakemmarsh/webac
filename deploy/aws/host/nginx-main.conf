# /etc/nginx/nginx.conf on the webac host (installed by bootstrap.sh).
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;
# A reload (every deploy switch) keeps the old workers serving their open
# WebSockets: game sessions run for hours. Matches the bridge's 6 h drain
# (BRIDGE_DRAIN_SECONDS=21600) plus a margin.
worker_shutdown_timeout 6h10m;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - [$time_iso8601] "$host" "$request" $status $body_bytes_sent $request_time';
    access_log /var/log/nginx/access.log main buffer=32k flush=10s;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    include /etc/nginx/conf.d/*.conf;
}
