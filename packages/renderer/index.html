      <h1>webAC: play Asheron's Call in your browser</h1>
      <p>webAC is a from-scratch Asheron's Call client that runs in your browser. There is nothing to install and no game files to download: pick a world from the public server list, log in with your existing account, and play.</p>
      <p>It works with ACE servers (end of retail), classic Dark Majesty servers, AC1999 and GDLE. The interface, art and sounds come from the original game data. It runs in Chrome, Firefox and Safari on a desktop or laptop.</p>
