<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asheron's Call — Browser Client</title>
  <!-- No favicon of our own: an empty one stops every page load logging /favicon.ico 404. -->
  <link rel="icon" href="data:," />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
    canvas { display: block; }
    /* Only the 3D game canvas fills the viewport. The blanket `canvas{width:100%}`
       rule used to stretch every JS-created canvas (bitmap-font labels, icons,
       meters) to its container — smearing the loading-screen status text. */
    #game-canvas { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
